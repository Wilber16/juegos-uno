<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juegos de cartas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
  body{margin:0;min-height:100dvh;background:#F3F4F8;color:#1B1B1F;font-family:'Nunito',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  main{max-width:520px;width:100%;display:flex;flex-direction:column;gap:16px}
  h1{margin:0;font:400 44px 'Lilita One',sans-serif}
  a.game{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:#fff;border:3px solid #1B1B1F;border-radius:18px;padding:18px 20px;box-shadow:0 6px 0 #1B1B1F}
  a.game:active{transform:translateY(4px);box-shadow:0 2px 0 #1B1B1F}
  a.game strong{font:400 34px 'Lilita One',sans-serif}
  a.game strong .a{color:#2F5BEA} a.game strong .b{color:#F06A0F}
  a.game span{font-weight:700;font-size:16px;line-height:1.4}
</style>
</head>
<body>
<main>
  <h1>Juegos de cartas</h1>
  <a class="game" href="jalon/">
    <strong><span class="a">¡JA</span><span class="b">LÓN!</span></strong>
    <span>El tira y afloja con una sola ficha. Saca una carta, jala la ficha a tu lado y llévala a la META.</span>
  </a>
</main>
</body>
</html>
